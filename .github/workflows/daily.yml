name: Daily forecast

on:
  schedule:
    - cron: "17 12 * * *"   # every day at 12:17 UTC = 7:17 am Eastern in winter, 8:17 in summer
  workflow_dispatch:         # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write            # lets the run save new data back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python src/daily.py

      - name: Save new data back to the repo
        if: ${{ !cancelled() }}    # save the regions that worked, even if one failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daily run $(date -u +%Y-%m-%d)"
          git push